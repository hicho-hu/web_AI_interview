map $uri $cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/api/ "no-store";
    ~^/ai-interview/ "no-store";
}
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 512m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control $cache_control always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # Docker Desktop: backend running on the host machine.
        # For Compose/Linux, replace with the backend service name or private address.
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
    }
    # Preserve the exact object path and query: both are signed by ali-oss.
    # This fixed upstream must match the backend OSS_BUCKET_NAME / OSS_ENDPOINT.
    location ~ ^/ai-interview/user/[A-Za-z0-9-]+/incoming/[A-Za-z0-9-]+\.[A-Za-z0-9]+$ {
        proxy_pass https://ai-interview-storage.oss-cn-hangzhou.aliyuncs.com;
        proxy_set_header Host ai-interview-storage.oss-cn-hangzhou.aliyuncs.com;
        proxy_set_header Origin "";
        proxy_set_header Cookie "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
    location /ai-interview/ {
        return 404;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
